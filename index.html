<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PlanHarbor — Coming soon</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #16372c;
      background: #f5f7f6;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 2rem 1.25rem;
      display: grid;
      place-items: center;
      text-align: center;
    }

    main { width: min(100%, 48rem); }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 650;
      line-height: 1.15;
      letter-spacing: -0.045em;
    }

    p {
      margin: 1.5rem 0 0;
      font-size: clamp(1.125rem, 3vw, 1.375rem);
      line-height: 1.6;
      text-wrap: balance;
    }

    footer {
      margin-top: 4rem;
      color: #52675d;
      font-size: 0.875rem;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: dark) {
      :root { color: #e8f0eb; background: #111d19; }
      footer { color: #becbc3; }
    }
  </style>
</head>
<body>
  <main>
    <h1>PlanHarbor</h1>
    <p>Retirement planning for households — coming soon.</p>
    <footer>© 2026 Cairnspire Technologies</footer>
  </main>
</body>
</html>
